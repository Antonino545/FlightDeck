name: Build & Release Multiplatform FlightDeck

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom Tag Name (leave empty to autogenerate next patch)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-tag:
    name: Determine Release Tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    outputs:
      release_tag: ${{ steps.tag_calc.outputs.release_tag }}
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Release Tag
        id: tag_calc
        run: |
          # 1. If explicit tag input provided via workflow_dispatch
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            echo "Using manual input tag: $TAG"
          # 2. If triggered by git tag push
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Using pushed git tag: $TAG"
          # 3. Autogenerate next patch tag on main branch push
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              # Fallback: extract version from Python models or default
              PY_VER=$(python3 -c "import re; m = re.search(r'__version__\s*=\s*[\"\']([^\"\']+)[\"\']', open('core/domain/models.py').read()); print(m.group(1) if m else '1.0.0')")
              TAG="v${PY_VER}"
            else
              # Strip leading v
              CLEAN_VER="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
            echo "Autogenerated next tag: $TAG (from previous: ${LATEST_TAG:-none})"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS DMG
    needs: [prepare-tag]
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-EventKit pyobjc-framework-Quartz

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Build macOS App & DMG
        run: |
          bash scripts/build_macos_dmg.sh "${{ needs.prepare-tag.outputs.release_tag }}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlightDeck-macOS-DMG
          path: FlightDeck-macOS.dmg

  build-ubuntu:
    name: Build Ubuntu DEB
    needs: [prepare-tag]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Caches downloaded .deb packages so apt-get doesn't re-fetch them
      # from archive.ubuntu.com / security.ubuntu.com on every run.
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-pyqt6 python3-pil gir1.2-edataserver-1.2 gir1.2-ecal-2.0 dpkg-dev

      - name: Install Python tooling
        run: |
          pip install --break-system-packages --upgrade pip PyQt6

      - name: Run Unit Tests
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m unittest discover -s tests -v

      - name: Build Debian Package
        run: |
          bash scripts/build_ubuntu_deb.sh "${{ needs.prepare-tag.outputs.release_tag }}"

      - name: Upload Ubuntu DEB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlightDeck-Ubuntu-DEB
          path: deb_dist/*.deb

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-tag, build-macos, build-ubuntu]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download macOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: FlightDeck-macOS-DMG
          path: release_assets/

      - name: Download Ubuntu Artifact
        uses: actions/download-artifact@v8
        with:
          name: FlightDeck-Ubuntu-DEB
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-tag.outputs.release_tag }}
          name: FlightDeck ${{ needs.prepare-tag.outputs.release_tag }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

