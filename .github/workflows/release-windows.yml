name: Build & Release Windows (Manual)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to attach installer to (leave empty for latest release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Determine Target Release Tag
        id: get_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            git fetch --tags --force
            TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$TAG" ]; then
              PY_VER=$(python3 -c "import re; m = re.search(r'__version__\s*=\s*[\"\']([^\"\']+)[\"\']', open('core/domain/models.py').read()); print(m.group(1) if m else '1.0.54')")
              TAG="v${PY_VER}"
            fi
          fi
          echo "Target tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt ruff

      - name: Run Linter & Unit Tests
        run: |
          ruff check .
          python -m unittest discover -s tests -v

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer
        run: |
          python scripts/build_windows_release.py "${{ steps.get_tag.outputs.tag }}"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlightDeck-Windows-Installer
          path: dist/FlightDeck-Setup.exe
          retention-days: 7

      - name: Attach Installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: dist/FlightDeck-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
