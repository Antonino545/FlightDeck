name: CI Test & Build

on:
  pull_request:
    branches:
      - main
      - test
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test & Build macOS (CI)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-EventKit pyobjc-framework-Quartz

      - name: Run Linter & Unit Tests
        run: |
          ruff check .
          python3 -m unittest discover -s tests -v

      - name: Build macOS App & DMG
        run: |
          bash scripts/build_macos_dmg.sh

      - name: Upload Test macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Test-FlightDeck-macOS-DMG
          path: FlightDeck-macOS.dmg
          retention-days: 7

  test-ubuntu:
    name: Test & Build Ubuntu (CI)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Caches downloaded .deb packages so apt-get doesn't re-fetch them
      # from archive.ubuntu.com / security.ubuntu.com on every run.
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-pyqt6 python3-pil gir1.2-edataserver-1.2 gir1.2-ecal-2.0 dpkg-dev

      - name: Install Python tooling
        run: |
          pip install --break-system-packages --upgrade pip ruff PyQt6

      - name: Run Linter & Unit Tests
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check .
          python3 -m unittest discover -s tests -v

      - name: Build Debian Package
        run: |
          bash scripts/build_ubuntu_deb.sh

      - name: Upload Test Ubuntu Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Test-FlightDeck-Ubuntu-DEB
          path: deb_dist/*.deb
          retention-days: 7

  test-windows:
    name: Test & Build Windows (CI)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt ruff

      - name: Run Linter & Unit Tests
        run: |
          ruff check .
          python -m unittest discover -s tests -v

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer
        run: |
          python scripts/build_windows_release.py

      - name: Upload Test Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Test-FlightDeck-Windows-Installer
          path: dist/FlightDeck-Setup.exe
          retention-days: 7


