[project]
name = "flightdeck"
version = "1.0.54"
description = "Cross-platform smart meeting reminder & flight deck application for macOS and Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Antonino", email = "antonino@flightdeck.local" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "requests",
    "urllib3",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-EventKit",
]
linux = [
    "PyQt6>=6.4.0",
    "PyGObject>=3.42.0",
]
dev = [
    "ruff",
]

[project.scripts]
flightdeck = "ui.app_launcher:launch_application"

[tool.ruff]
line-length = 150
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
]
ignore = [
    "E501", # line too long (handled by formatter or ignored)
    "F401", # unused import (for now, to avoid breaking legacy code aggressively)
    "F403", # star imports
    "F405", # name may be undefined, or defined from star imports
    "E701", # multiple statements on one line
    "E731", # do not assign a lambda expression
    "E402", # module level import not at top of file
    "F841", # local variable is assigned to but never used
    "E702", # multiple statements on one line (semicolon)
    "W291", # trailing whitespace
    "W293", # blank line contains whitespace
]
